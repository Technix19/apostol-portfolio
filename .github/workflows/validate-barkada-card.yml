name: Validate Barkada League portfolio project

on:
  push:
    branches:
      - feat/add-barkada-league-20261104
    paths:
      - src/data/portfolio.ts
      - next.config.ts
      - public/barkada-league.webp
      - .github/workflows/validate-barkada-card.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:pages
      - name: Check GitHub Pages image and project links
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s out/barkada-league.webp
          grep -Fq 'Barkada League' out/index.html
          grep -Fq 'https://github.com/Technix19/Barkada_League' out/index.html
          grep -Fq 'https://barkada-league.vercel.app/' out/index.html
          grep -Fq '/apostol-portfolio/barkada-league.webp' out/index.html
          echo "PASS: project thumbnail and GitHub/live links render in the static portfolio"
