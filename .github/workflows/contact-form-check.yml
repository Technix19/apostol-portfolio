name: Verify portfolio contact form

on:
  push:
    branches: [fix/contact-form-delivery-20261104]
    paths:
      - src/components/portfolio/Contact.tsx
      - .github/workflows/contact-form-check.yml
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  form:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Verify Next.js production build with browser form key
        env:
          NEXT_PUBLIC_FORMSPREE_FORM_ID: ci-test-form-id
        run: npm run build
      - name: Verify static GitHub Pages export without key
        env:
          NEXT_PUBLIC_FORMSPREE_FORM_ID: ""
        run: npm run build:pages
      - name: Install test-only Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser-test provider errors and success (mocked, no email sent)
        shell: bash
        env:
          NEXT_PUBLIC_FORMSPREE_FORM_ID: ci-test-form-id
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport:{width:1280,height:900}, reducedMotion:'reduce' });
            await page.goto('http://127.0.0.1:3100/', {waitUntil:'domcontentloaded'});
            await page.getByRole('heading',{name:'Send me a message'}).waitFor();
            await page.getByLabel(/First name/i).fill('Test');
            await page.getByLabel(/Last name/i).fill('Visitor');
            await page.getByLabel(/Email address/i).fill('visitor@example.com');
            await page.getByLabel(/What can I help with/i).selectOption('General Question');
            await page.getByLabel('Message').fill('A test message — no email should be delivered from CI.');
            let count=0;
            await page.route('https://formspree.io/f/ci-test-form-id',async route=>{
              count+=1;
              const data=route.request().postData() ?? '';
              assert.match(data,/visitor@example.com/);
              assert.match(data,/Test Visitor/);
              assert.match(data,/General Question/);
              await route.fulfill({status:count===1?400:200,contentType:'application/json',body:JSON.stringify(count===1?{errors:[{message:'Invalid test form'}]}:{ok:true})});
            });
            await page.getByRole('button',{name:/Send message/}).click();
            await page.waitForFunction(
              () => document.querySelector('form [role="alert"]')?.textContent?.includes('Invalid test form'),
              null, {timeout:15000}
            );
            const error=page.locator('form [role="alert"]');
            assert.match((await error.textContent()) ?? '',/Invalid test form/);
            const draft=error.getByRole('link',{name:'Open an email draft'});
            assert.match(await draft.getAttribute('href'),/^mailto:lanceapostol04@gmail.com\?/);
            assert.equal(await page.getByLabel(/First name/i).inputValue(),'Test');
            await page.getByRole('button',{name:/Send message/}).click();
            await page.getByRole('status').getByText('Message received.').waitFor();
            assert.equal(count,2);
            console.log('PASS: error retains form and offers direct email fallback; success requires provider confirmation.');
            await page.close();
          } finally {await browser.close();}
          JS
