name: Capture Barkada League project thumbnail

on:
  push:
    branches: [feat/add-barkada-league-20261104]
    paths: [.github/workflows/capture-barkada-thumbnail.yml]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot and WebP tooling
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
      - name: Capture the same landing-page viewport as the reference
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright'
          import sharp from 'sharp'
          import fs from 'node:fs'
          const browser = await chromium.launch({headless: true})
          try {
            const page = await browser.newPage({
              viewport: { width: 2047, height: 1115 },
              deviceScaleFactor: 1,
              reducedMotion: 'reduce'
            })
            const response = await page.goto('https://barkada-league.vercel.app/', { waitUntil:'networkidle', timeout:60000 })
            if (!response?.ok()) throw new Error('Landing page returned an HTTP error')
            await page.getByRole('heading', { name: /Every match counts/i }).waitFor()
            await page.screenshot({ path:'barkada-landing-capture.png' })
            await sharp('barkada-landing-capture.png')
              .resize({ width: 1280, withoutEnlargement: true })
              .webp({ quality: 84, effort: 5 })
              .toFile('public/barkada-league.webp')
            const result = await sharp('public/barkada-league.webp').metadata()
            if (result.width < 1000 || result.height < 500) throw new Error('Unexpected thumbnail dimensions')
            console.log('Captured Barkada League thumbnail:', result.width, 'x', result.height, fs.statSync('public/barkada-league.webp').size, 'bytes')
          } finally {
            await browser.close()
          }
          JS
      - name: Commit thumbnail to the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/barkada-league.webp
          git diff --cached --quiet || git commit -m 'assets: add Barkada League landing-page screenshot thumbnail'
          git push origin HEAD:feat/add-barkada-league-20261104
      - uses: actions/upload-artifact@v4
        with:
          name: barkada-league-thumbnail-preview
          path: public/barkada-league.webp
          retention-days: 5
